# AIQE —— 测试左移（Shift-Left）AI 评估框架参考实现（Apache-2.0）
#
# 设计约束：
#   - 纯标准库实现，零运行时第三方依赖（schema 用 dataclass 而非 pydantic）
#   - 唯一开发依赖是 pytest（测试框架）

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "AIQE"
version = "0.1.0"
description = "测试左移（Shift-Left）AI 评估框架参考实现：在生成前先跑分，用确定性评分拦截模型质量回归"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "halewong" }]
keywords = ["ai-evaluation", "shift-left", "testing", "llm", "quality-engineering"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Testing",
]
# 运行时零依赖：纯标准库
dependencies = []

[project.urls]
Homepage = "https://github.com/haleSnW/AIQE"
Source = "https://github.com/haleSnW/AIQE"
"Bug Tracker" = "https://github.com/haleSnW/AIQE/issues"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# 收集告警过滤（schema 中的 TestCase 类会被 pytest 误报）
filterwarnings = [
    "ignore:.*cannot collect test class.*",
]
