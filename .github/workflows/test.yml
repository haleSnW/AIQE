# AIQE —— 持续集成：任何 clone 本仓库的用户，一次 CI 验证 AIQE
#
#  - 单元/契约测试：Python 3.10 / 3.11 / 3.12 全矩阵
#  - 示例冒烟：mock 后端快速跑分 + 回归对比（零依赖零网络，无需 GPU）

name: test

# 注意：GitHub Actions 的触发键写作 "on"，加引号以兼容所有 YAML 解析器
"on":
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    name: pytest (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install AIQE + dev deps
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Run full test suite
        run: python -m pytest -q

  smoke:
    name: Examples smoke (mock, offline)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install AIQE
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: Quick score (mock backend, 30s report)
        run: python examples/quick_score.py

      - name: Regression comparison (baseline + degraded round)
        run: python examples/regression_compare.py --degrade

      - name: Archive evaluation reports
        uses: actions/upload-artifact@v4
        with:
          name: aiqe-reports
          path: |
            AIQE-report.json
            examples/.regression-demo/*.json
          if-no-files-found: ignore
