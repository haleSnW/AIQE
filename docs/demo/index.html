<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- 零外部资源的结构性保证：default-src 'none' 拒绝一切外部加载，
     connect-src 'none' 拒绝 fetch/XHR/WebSocket（即无遥测、无回传）。 -->
<meta http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src data:; font-src 'none'; connect-src 'none'; form-action 'none'; base-uri 'none'">
<title>AIQE Dashboard</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #ffffff; --ink: #1c1f23; --muted: #6b7280;
    --line: #e3e6ea; --ok: #1a7f4b; --warn: #a86400; --bad: #b3261e;
    --accent: #2c5fb3; --gap: #8a6d00;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    /* 只用系统字体 —— 不下载任何远程字体 */
    font: 14px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text",
          "Helvetica Neue", "PingFang SC", "Hiragino Sans GB", Arial, sans-serif;
  }
  .wrap { max-width: 1440px; margin: 0 auto; padding: 0 28px 72px; }

  /* ── D4 来源横幅：让误提交的产物一眼可辨 ── */
  .banner {
    background: #1c1f23; color: #fff; padding: 14px 28px;
    display: flex; align-items: baseline; gap: 20px; flex-wrap: wrap;
  }
  .banner h1 { font-size: 16px; margin: 0; font-weight: 600; letter-spacing: .2px; }
  .banner .tag {
    font-size: 12px; padding: 2px 8px; border-radius: 999px;
    background: rgba(255,255,255,.14); color: #e8eaed;
  }
  .banner .tag.synth { background: #1a7f4b; }
  .banner .spacer { flex: 1; }
  .banner .meta { font-size: 12px; color: #b6bcc4; }

  h2 { font-size: 15px; margin: 0 0 4px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  section {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 10px; padding: 18px 20px; margin-top: 18px;
    overflow-x: auto;
  }
  section.alert { border-color: #e8c9c6; background: #fffafa; }

  /* ── 指标卡片 ── */
  .cards { display: flex; gap: 12px; flex-wrap: wrap; }
  .card {
    flex: 1 1 168px; min-width: 168px; border: 1px solid var(--line);
    border-radius: 8px; padding: 12px 14px; background: #fcfcfd;
  }
  .card .label { font-size: 12px; color: var(--muted); }
  .card .value { font-size: 24px; font-weight: 600; margin-top: 4px;
                 font-variant-numeric: tabular-nums; }
  .card .foot { font-size: 11px; color: var(--muted); margin-top: 4px; }
  .card.pair { border-left: 3px solid var(--accent); }

  /* 缺失值：永远不是 0 */
  .na { color: var(--muted); font-weight: 500; }
  .badge { font-size: 11px; padding: 1px 7px; border-radius: 999px;
           border: 1px solid var(--line); color: var(--muted); }
  .badge.ok { color: var(--ok); border-color: #bfe0cd; background: #f2fbf6; }
  .badge.bad { color: var(--bad); border-color: #eec7c3; background: #fdf4f3; }
  .badge.warn { color: var(--warn); border-color: #e8d5ac; background: #fdf9ef; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--line); }
  th { font-size: 12px; color: var(--muted); font-weight: 600;
       background: #fafbfc; position: sticky; top: 0; }
  td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
  tr:last-child td { border-bottom: none; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  /* ── 数据缺口面板 ── */
  .gaps { margin-top: 16px; border: 1px dashed #e0d4a8; background: #fffdf5;
          border-radius: 8px; padding: 12px 14px; }
  .gaps h3 { margin: 0 0 8px; font-size: 13px; color: var(--gap); }
  .gaps table { font-size: 12px; }
  .gaps td { border-bottom: 1px solid #f0e9d6; }

  /* ── 控件 ── */
  .controls { display: flex; gap: 14px; align-items: center; flex-wrap: wrap;
              margin-bottom: 14px; }
  .controls label { font-size: 12px; color: var(--muted); margin-right: 6px; }
  select {
    font: inherit; font-size: 13px; padding: 5px 8px; border-radius: 6px;
    border: 1px solid var(--line); background: #fff; color: var(--ink); max-width: 420px;
  }
  .empty { color: var(--muted); padding: 18px 0; font-size: 13px; }

  /* ── 图表 ── */
  .chart { width: 100%; height: 260px; display: block; margin: 6px 0 4px; }
  .legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px;
            color: var(--muted); margin-bottom: 6px; }
  .legend .swatch { display: inline-block; width: 18px; height: 3px;
                    vertical-align: middle; margin-right: 6px; border-radius: 2px; }
  .signal { margin: 16px 0; display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 20px; }
  .signal h3 { margin: 0 0 4px; font-size: 13px; }
  .signal p { margin: 0 0 8px; font-size: 11px; color: var(--muted); }
  .stacked { display: flex; height: 14px; overflow: hidden; border-radius: 7px; background: #eef0f2; }
  .stacked span { display: block; min-width: 0; }
  .signal .legend { margin-top: 7px; gap: 10px; }
  .signal .legend b { font-weight: 600; }
  .swatch-square { display: inline-block; width: 9px; height: 9px; margin-right: 5px; border-radius: 2px; }
  @media (max-width: 720px) {
    .wrap { padding: 0 12px 36px; }
    section { padding: 14px; }
    .signal { grid-template-columns: 1fr; gap: 12px; }
    .card { flex-basis: 145px; min-width: 145px; }
    .banner { padding: 12px; gap: 8px; }
    .chart { min-width: 560px; }
    table { min-width: 560px; }
  }

  .notice { border-left: 3px solid var(--warn); background: #fdf9ef;
            padding: 9px 12px; border-radius: 6px; font-size: 12.5px;
            color: #6b5417; margin: 10px 0; }
  .notice.bad { border-left-color: var(--bad); background: #fdf4f3; color: #7a1c17; }
  .transitions { display: flex; gap: 12px; flex-wrap: wrap; margin: 12px 0; }
  .tcard { flex: 1 1 200px; border: 1px solid var(--line); border-radius: 8px;
           padding: 10px 12px; }
  .tcard .n { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .tcard .l { font-size: 12px; color: var(--muted); }
  ul.cases { margin: 6px 0 0; padding-left: 18px; font-size: 12.5px; }
  ul.cases li { margin: 1px 0; }
</style>
</head>
<body>
<div class="banner">
  <h1>AIQE Dashboard</h1>
  <span class="tag" id="b-src">—</span>
  <span class="tag" id="b-class">—</span>
  <span class="spacer"></span>
  <span class="meta" id="b-meta">—</span>
</div>

<div class="wrap">
  <section id="overview">
    <h2>质量总览</h2>
    <p class="sub" id="ov-sub">—</p>
    <div class="cards" id="ov-cards"></div>
    <div id="ov-dist" style="margin-top:16px"></div>
    <div class="gaps" id="ov-gaps"></div>
  </section>

  <section id="trend">
    <h2>质量趋势</h2>
    <p class="sub">同一分组内按运行时间排序；缺失数据断开连线，不以 0 代替。</p>
    <div class="controls">
      <span><label for="trend-group">分组</label><select id="trend-group"></select></span>
      <span><label for="trend-metric">指标</label><select id="trend-metric"></select></span>
    </div>
    <div id="trend-body"></div>
  </section>

  <section id="regression">
    <h2>回归对比</h2>
    <p class="sub">基线 → 候选。不可比时只显示原因，不显示任何变化数字。</p>
    <div class="controls">
      <span><label for="cmp-group">分组</label><select id="cmp-group"></select></span>
      <span><label for="cmp-base">基线</label><select id="cmp-base"></select></span>
      <span><label for="cmp-cand">候选</label><select id="cmp-cand"></select></span>
    </div>
    <div id="cmp-body"></div>
  </section>

  <section id="unreadable">
    <h2>无法读取的文件</h2>
    <p class="sub">校验失败的文件不会被静默跳过 —— 数据损坏必须可见。</p>
    <div id="unreadable-body"></div>
  </section>
</div>

ms", "metric_unit": "milliseconds", "metric_value": 120.0, "metric_version": "aiqe.metrics/0.1.0", "precision": "measured", "reason": "p50（共 2 个有效样本；失败用例已排除）", "scope": "run", "status": "ok"}, "output_tokens": {"case_id": null, "metric_id": "output_tokens", "metric_unit": "tokens", "metric_value": 16, "metric_version": "aiqe.metrics/0.1.0", "precision": "estimated", "reason": "", "scope": "run", "status": "ok"}, "regression_count": {"case_id": null, "metric_id": "regression_count", "metric_unit": "count", "metric_value": 2, "metric_version": "aiqe.metrics/0.1.0", "precision": "measured", "reason": "", "scope": "run", "status": "ok"}, "severity_distribution": {"case_id": null, "metric_id": "severity_distribution", "metric_unit": "distribution", "metric_value": null, "metric_version": "aiqe.metrics/0.1.0", "precision": "measured", "reason": "全仓库无 severity 字段；将 judge.checks 硬映射为严重度属主观赋权，需领域决策", "scope": "run", "status": "undefined"}, "timeout_count": {"case_id": null, "metric_id": "timeout_count", "metric_unit": "count", "metric_value": null, "metric_version": "aiqe.metrics/0.1.0", "precision": "measured", "reason": "ExecutionRunner 将所有非 RuntimeError 异常压平为自由文本，无结构化超时分类；字符串匹配不可靠，故不产出数值", "scope": "run", "status": "undefined"}, "tokens_per_second": {"case_id": null, "metric_id": "tokens_per_second", "metric_unit": "tokens/second", "metric_value": 72.0, "metric_version": "aiqe.metrics/0.1.0", "precision": "estimated", "reason": "", "scope": "run", "status": "ok"}}, "model_id": "demo-model-b", "run_id": "showcase-06-run_h_candidate", "source_path": "runs/showcase-06.json", "source_type": "synthetic"}], "totals": {"group_count": 1, "run_count": 6, "unreadable_count": 0}, "unreadable": []}</script>
<script>
(function () {
  "use strict";

  var DATA = JSON.parse(document.getElementById("aiqe-data").textContent);
  var RUNS = {}; DATA.runs.forEach(function (r) { RUNS[r.run_id] = r; });

  // ── 数值处理：缺失永远是 null，永远不是 0 ──────────────────
  function isNum(v) { return typeof v === "number" && isFinite(v); }
  function valueOf(rec) {
    if (!rec) return null;
    if (rec.status !== "ok" && rec.status !== "partial") return null;
    return isNum(rec.metric_value) ? rec.metric_value : null;
  }
  function esc(s) {
    return String(s == null ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;")
      .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function fmt(value, unit) {
    if (value === null) return null;
    if (unit === "ratio") return (value * 100).toFixed(1) + "%";
    if (unit === "count" || unit === "tokens") return String(Math.round(value));
    if (unit === "milliseconds") return value.toFixed(1) + " ms";
    if (unit === "score") return value.toFixed(3);
    if (unit === "score_delta") return (value >= 0 ? "+" : "") + value.toFixed(3);
    if (unit === "tokens/second") return value.toFixed(1) + " tok/s";
    return String(value);
  }
  // 差值按**被减数的单位**格式化：计数指标不该显示 "+0.000"。
  function fmtDelta(value, unit) {
    if (value === null) return null;
    var sign = value > 0 ? "+" : "";
    if (unit === "ratio") return sign + (value * 100).toFixed(1) + " pp";
    if (unit === "count" || unit === "tokens") return sign + Math.round(value);
    if (unit === "milliseconds") return sign + value.toFixed(1) + " ms";
    if (unit === "tokens/second") return sign + value.toFixed(1) + " tok/s";
    return sign + value.toFixed(3);
  }
  function cell(rec) {
    var v = valueOf(rec);
    if (v === null) {
      var why = rec ? (rec.status + (rec.reason ? "：" + rec.reason : "")) : "无该指标记录";
      return '<span class="na" title="' + esc(why) + '">N/A</span>';
    }
    return esc(fmt(v, rec.metric_unit));
  }
  function statusBadge(rec) {
    if (!rec) return '<span class="badge">无记录</span>';
    var cls = rec.status === "ok" ? "ok"
            : (rec.status === "partial" ? "warn" : "");
    return '<span class="badge ' + cls + '">' + esc(rec.status) + "</span>";
  }

  // ── 横幅（D4）────────────────────────────────────────────
  function renderBanner() {
    var types = {}, classes = {};
    DATA.runs.forEach(function (r) {
      types[r.source_type] = 1; classes[r.data_classification] = 1;
    });
    var t = Object.keys(types).join(" / ") || "（无运行）";
    var c = Object.keys(classes).join(" / ") || "（无运行）";
    var srcEl = document.getElementById("b-src");
    srcEl.textContent = "数据来源: " + t;
    if (Object.keys(types).length === 1 && types["synthetic"]) {
      srcEl.className = "tag synth";
    }
    document.getElementById("b-class").textContent = "分级: " + c;
    document.getElementById("b-meta").textContent =
      "运行 " + DATA.totals.run_count + " 次 · 分组 " + DATA.totals.group_count +
      " 个 · 生成于 " + DATA.generated_at + " · " + DATA.dashboard_version;
  }

  // ── A/B: 总览 ────────────────────────────────────────────
  function renderOverview() {
    var sub = document.getElementById("ov-sub");
    var cards = document.getElementById("ov-cards");
    var gaps = document.getElementById("ov-gaps");

    if (!DATA.runs.length) {
      sub.textContent = "尚未导入任何运行结果。";
      cards.innerHTML = '<div class="empty">没有可展示的数据。' +
        '请用 <span class="mono">--runs</span> 指向运行结果文件或目录。</div>';
      gaps.style.display = "none";
      document.getElementById("ov-dist").innerHTML = "";
      return;
    }

    var latest = DATA.runs[DATA.runs.length - 1];
    var c = latest.case_status_counts;

    // 时间戳并列时，「最近一次」是**排序次键（run_id）**的结果，不是事实。
    // 必须显式说明，否则用户会以为这个运行真的最新。
    var tied = DATA.runs.filter(function (r) {
      return r.created_at === latest.created_at;
    }).length;

    sub.innerHTML = "共 " + DATA.runs.length + " 次运行。最近一次：" +
      '<span class="mono">' + esc(latest.run_id) + "</span> · " +
      esc(latest.created_at) + " · 模型 " + esc(latest.model_id) +
      (tied > 1
        ? '<br><span class="na">⚠️ 有 ' + tied + ' 次运行的 created_at 完全相同（' +
          esc(latest.created_at) + "），无法据此判定先后；" +
          "此处按 run_id 排序取末位，该选择不代表真实时间顺序。</span>"
        : "");

    // case_pass_rate 与 execution_success_rate **强制并排**：
    // 只看其一无法区分「环境挂了」与「模型变差」。
    var html = "";
    function card(label, rec, foot, pair) {
      var v = valueOf(rec);
      var shown = v === null
        ? '<span class="na" title="' + esc(rec ? rec.status + "：" + (rec.reason || "") : "") +
          '">N/A</span>'
        : esc(fmt(v, rec.metric_unit));
      return '<div class="card' + (pair ? " pair" : "") + '">' +
        '<div class="label">' + esc(label) + "</div>" +
        '<div class="value">' + shown + "</div>" +
        '<div class="foot">' + esc(foot || "") + "</div></div>";
    }
    html += card("用例通过率", latest.metrics["case_pass_rate"], "judge 判定通过 / 全部用例", true);
    html += card("执行成功率", latest.metrics["execution_success_rate"], "执行未报错 / 全部用例", true);
    html += card("执行错误数", latest.metrics["execution_error_count"], "count");
    html += card("回归 / 退化", latest.metrics["regression_count"],
                 "退化 " + (valueOf(latest.metrics["degraded_count"]) === null
                            ? "N/A" : valueOf(latest.metrics["degraded_count"])));
    html += card("评分均值", latest.metrics["judge_score"], "run 级均值");
    html += card("时延 p50", latest.metrics["latency_ms"], "失败用例已排除");
    html += card("输出 token", latest.metrics["output_tokens"],
                 latest.metrics["output_tokens"] &&
                 latest.metrics["output_tokens"].precision === "estimated" ? "估算值" : "");
    cards.innerHTML = html;

    // 同一批用例的状态构成；长度由真实计数决定，空集不伪造 0% 分布。
    var signal = '';
    if (latest.case_count > 0) {
      var parts = [
        ['通过', c.passed, 'var(--ok)'],
        ['判定失败', c.failed, 'var(--bad)'],
        ['执行错误', c.error, 'var(--warn)'],
        ['未判定', c.skipped, 'var(--muted)']
      ];
      signal = '<div class="signal"><div><h3>用例结果构成</h3>' +
        '<p>分母 ' + latest.case_count + ' 个用例；执行错误与判定失败分开统计</p>' +
        '<div class="stacked" role="img" aria-label="' +
        esc(parts.map(function (p) { return p[0] + ' ' + p[1]; }).join('，')) + '">';
      parts.forEach(function (part) {
        if (part[1] > 0) signal += '<span style="width:' +
          (part[1] / latest.case_count * 100).toFixed(2) + '%;background:' + part[2] + '"></span>';
      });
      signal += '</div><div class="legend">' + parts.map(function (part) {
        return '<span><i class="swatch-square" style="background:' + part[2] +
          '"></i>' + esc(part[0]) + ' <b>' + part[1] + '</b></span>';
      }).join('') + '</div></div>';
      var pass = valueOf(latest.metrics.case_pass_rate);
      var exec = valueOf(latest.metrics.execution_success_rate);
      signal += '<div><h3>质量与执行覆盖</h3><p>同一分母，分开展示模型表现与运行环境</p>';
      [['用例通过', pass, 'var(--accent)'], ['执行成功', exec, 'var(--ok)']].forEach(function (part) {
        signal += '<div class="legend">' + esc(part[0]) + ': ' +
          (part[1] === null ? 'N/A' : esc(fmt(part[1], 'ratio'))) + '</div>';
        if (part[1] !== null) signal += '<div class="stacked" role="img" aria-label="' +
          esc(part[0] + ' ' + fmt(part[1], 'ratio')) + '"><span style="width:' +
          (part[1] * 100).toFixed(2) + '%;background:' + part[2] + '"></span></div>';
      });
      signal += '</div></div>';
    }

    // 用例状态分布（通过 / 失败 / 错误 / 跳过）
    var dist = '<table><thead><tr><th>用例状态</th><th class="num">数量</th>' +
      '<th>含义</th></tr></thead><tbody>';
    dist += '<tr><td>passed</td><td class="num">' + c.passed + '</td><td>judge 判定通过</td></tr>';
    dist += '<tr><td>failed</td><td class="num">' + c.failed + '</td><td>执行成功但判定不通过</td></tr>';
    dist += '<tr><td>error</td><td class="num">' + c.error + '</td><td>执行报错，未进入判定</td></tr>';
    dist += '<tr><td>skipped</td><td class="num">' + c.skipped +
      '</td><td>无 judge 结果，<b>无法判定</b>（不计入失败）</td></tr>';
    dist += '<tr><td>合计</td><td class="num">' + latest.case_count + '</td><td></td></tr>';
    dist += "</tbody></table>";

    // 数据缺口面板：15 个指标里测不了的那些必须显式列出，
    // 否则用户会以为「AIQE 只有这些指标」而不是「有些测不了」。
    var missing = [];
    Object.keys(latest.metrics).forEach(function (id) {
      var rec = latest.metrics[id];
      if (rec.status !== "ok" && rec.status !== "partial") missing.push([id, rec]);
    });
    var gapHtml = "";
    if (missing.length) {
      gapHtml = "<h3>数据缺口（" + missing.length + " 项 —— 本次运行无法计算的指标）</h3>" +
        '<table><tbody>';
      missing.forEach(function (pair) {
        gapHtml += "<tr><td class=\"mono\">" + esc(pair[0]) + "</td>" +
          "<td>" + statusBadge(pair[1]) + "</td>" +
          "<td>" + esc(pair[1].reason || "") + "</td></tr>";
      });
      gapHtml += "</tbody></table>";
    } else {
      gapHtml = "<h3>数据缺口（0 项）</h3><div class=\"empty\">本次运行的全部指标均已计算。</div>";
    }
    gaps.innerHTML = gapHtml;
    document.getElementById("ov-dist").innerHTML = signal + dist;
  }

  // ── C: 趋势 ──────────────────────────────────────────────
  function groupOptions(selectEl, onchange) {
    selectEl.innerHTML = "";
    DATA.groups.forEach(function (g, i) {
      var o = document.createElement("option");
      o.value = String(i);
      o.textContent = g.dataset_id + "@" + g.dataset_version +
        " · " + g.judge_id + "@" + g.judge_version + "  (" + g.run_ids.length + " 次运行)";
      selectEl.appendChild(o);
    });
    selectEl.onchange = onchange;
  }

  var trendGroup = 0, trendMetric = null;

  function renderTrend() {
    var host = document.getElementById("trend-body");
    if (!DATA.groups.length) {
      host.innerHTML = '<div class="empty">没有可分组的运行数据。</div>';
      return;
    }
    var g = DATA.groups[trendGroup];
    if (!trendMetric || g.metric_ids.indexOf(trendMetric) < 0) {
      trendMetric = g.metric_ids.indexOf("judge_score") >= 0
        ? "judge_score" : (g.metric_ids[0] || null);
    }
    var msel = document.getElementById("trend-metric");
    msel.innerHTML = "";
    g.metric_ids.forEach(function (id) {
      var o = document.createElement("option");
      o.value = id; o.textContent = id;
      if (id === trendMetric) o.selected = true;
      msel.appendChild(o);
    });

    if (!trendMetric) { host.innerHTML = '<div class="empty">该分组没有指标记录。</div>'; return; }
    var trend = g.trends[trendMetric];

    var html = "";
    if (trend.is_split) {
      html += '<div class="notice">该指标存在不同的 <b>precision</b>（精度来源），' +
        '已拆分为多条独立系列 —— 估算值与实测值不可连成一条线。</div>';
    }
    if (trend.has_gaps) {
      html += '<div class="notice">该指标在部分运行中缺失，折线已在此处断开。' +
        '缺失不等于 0。</div>';
    }

    html += '<div class="legend">';
    var colors = ["#2c5fb3", "#a86400", "#1a7f4b", "#8a3fb3"];
    trend.series.forEach(function (s, i) {
      html += '<span><span class="swatch" style="background:' + colors[i % 4] + '"></span>' +
        esc(s.precision) + " · " + esc(s.metric_version) + "</span>";
    });
    html += "</div>";

    html += '<svg class="chart" id="trend-svg" preserveAspectRatio="none"></svg>';

    // 表格与图并存：图看趋势，表看确切数值与缺失原因
    html += '<table><thead><tr><th>运行</th><th>时间</th><th class="num">值</th>' +
      '<th>状态</th><th>说明</th></tr></thead><tbody>';
    g.run_ids.forEach(function (rid) {
      var run = RUNS[rid], rec = run.metrics[trendMetric];
      var isGap = rec && rec.status !== "ok" && rec.status !== "partial";
      html += "<tr><td class=\"mono\">" + esc(rid) + "</td><td>" + esc(run.created_at) +
        '</td><td class="num">' + cell(rec) + "</td><td>" + statusBadge(rec) +
        "</td><td>" + esc(rec ? (rec.reason || "") : "该运行不含此指标") + "</td></tr>";
    });
    html += "</tbody></table>";
    host.innerHTML = html;

    drawChart(trend, g.run_ids, colors);
  }

  function drawChart(trend, runIds, colors) {
    var svg = document.getElementById("trend-svg");
    if (!svg) return;
    var W = svg.clientWidth || 1000, H = 260;
    var padL = 64, padR = 20, padT = 16, padB = 34;
    svg.setAttribute("viewBox", "0 0 " + W + " " + H);

    var all = [];
    trend.series.forEach(function (s) {
      s.points.forEach(function (p) { if (isNum(p.value)) all.push(p.value); });
    });
    if (!all.length) {
      svg.innerHTML = '<text x="' + (W / 2) + '" y="' + (H / 2) +
        '" text-anchor="middle" fill="#6b7280" font-size="13">无可绘制的数值（全部缺失）</text>';
      return;
    }
    var lo = Math.min.apply(null, all), hi = Math.max.apply(null, all);
    if (lo === hi) { lo -= 0.5; hi += 0.5; }
    var span = hi - lo, pad = span * 0.12; lo -= pad; hi += pad;

    var n = Math.max(runIds.length, 2);
    function X(i) { return padL + (W - padL - padR) * (i / (n - 1 || 1)); }
    function Y(v) { return padT + (H - padT - padB) * (1 - (v - lo) / (hi - lo)); }

    var out = "";
    // 网格与刻度
    for (var k = 0; k <= 4; k++) {
      var v = lo + (hi - lo) * k / 4, y = Y(v);
      out += '<line x1="' + padL + '" y1="' + y + '" x2="' + (W - padR) + '" y2="' + y +
        '" stroke="#e3e6ea" stroke-width="1"/>';
      out += '<text x="' + (padL - 8) + '" y="' + (y + 4) +
        '" text-anchor="end" fill="#6b7280" font-size="11">' + esc(fmt(v, trend.metric_unit)) + "</text>";
    }
    // 每条系列：按 run 顺序取值，遇到缺失就断线（不插值、不补 0）
    trend.series.forEach(function (s, si) {
      var byRun = {};
      s.points.forEach(function (p) { byRun[p.run_id] = p.value; });
      var segs = [], cur = [];
      runIds.forEach(function (rid, i) {
        var v = byRun[rid];
        if (isNum(v)) { cur.push([X(i), Y(v)]); }
        else if (cur.length) { segs.push(cur); cur = []; }
      });
      if (cur.length) segs.push(cur);
      var color = colors[si % 4];
      segs.forEach(function (seg) {
        if (seg.length > 1) {
          out += '<polyline fill="none" stroke="' + color + '" stroke-width="2" points="' +
            seg.map(function (p) { return p[0].toFixed(1) + "," + p[1].toFixed(1); }).join(" ") +
            '"/>';
        }
        seg.forEach(function (p) {
          out += '<circle cx="' + p[0].toFixed(1) + '" cy="' + p[1].toFixed(1) +
            '" r="3.5" fill="' + color + '"/>';
        });
      });
      // 缺口：空心标记，明确「这里没有数据」而不是「这里是 0」
      s.gaps.forEach(function (gap) {
        var i = runIds.indexOf(gap.run_id);
        if (i < 0) return;
        out += '<circle cx="' + X(i).toFixed(1) + '" cy="' + (H - padB) +
          '" r="3" fill="none" stroke="#b3261e" stroke-width="1.5"/>';
      });
    });
    // X 轴标签（运行序号 + 短 id）
    runIds.forEach(function (rid, i) {
      out += '<text x="' + X(i).toFixed(1) + '" y="' + (H - padB + 16) +
        '" text-anchor="middle" fill="#6b7280" font-size="10">' +
        esc(rid.length > 14 ? rid.slice(0, 13) + "…" : rid) + "</text>";
    });
    out += '<line x1="' + padL + '" y1="' + (H - padB) + '" x2="' + (W - padR) +
      '" y2="' + (H - padB) + '" stroke="#c9ced4" stroke-width="1"/>';
    svg.innerHTML = out;
  }

  // ── D: 回归对比 ──────────────────────────────────────────
  var cmpGroup = 0, cmpBase = null, cmpCand = null;

  function renderComparison() {
    var host = document.getElementById("cmp-body");
    if (!DATA.groups.length) {
      host.innerHTML = '<div class="empty">没有可对比的运行数据。</div>';
      return;
    }
    var g = DATA.groups[cmpGroup];
    var ids = g.run_ids;

    // 默认选「最近两次**有用例**的运行」：用例集为空的运行几乎全是 N/A，
    // 拿它当默认候选会让对比区一开就是一堆 N/A。空运行仍可在下拉框中选择。
    var withCases = ids.filter(function (id) { return RUNS[id].case_count > 0; });
    var pool = withCases.length >= 2 ? withCases : ids;
    var skippedEmpty = pool !== ids;

    if (!cmpBase || ids.indexOf(cmpBase) < 0) {
      cmpBase = pool.length > 1 ? pool[pool.length - 2] : pool[0];
    }
    if (!cmpCand || ids.indexOf(cmpCand) < 0) {
      cmpCand = pool[pool.length - 1];
    }

    function fill(sel, chosen) {
      sel.innerHTML = "";
      ids.forEach(function (id) {
        var o = document.createElement("option");
        o.value = id; o.textContent = id;
        if (id === chosen) o.selected = true;
        sel.appendChild(o);
      });
    }
    fill(document.getElementById("cmp-base"), cmpBase);
    fill(document.getElementById("cmp-cand"), cmpCand);

    if (ids.length < 2) {
      host.innerHTML = '<div class="empty">该分组只有 1 次运行，无法进行回归对比。' +
        "至少需要同一分组内的两次运行。</div>";
      return;
    }
    if (cmpBase === cmpCand) {
      host.innerHTML = '<div class="notice">基线候选相同，请选择两次不同的运行。</div>';
      return;
    }

    var key = JSON.stringify([cmpBase, cmpCand]);
    var cmp = g.comparisons.by_key[key];
    if (!cmp) {
      host.innerHTML = '<div class="notice">该组合未预计算（分组内运行数超过 ' +
        "上限，仅保留最近若干次的两两比对）。</div>";
      return;
    }

    var html = "";
    html += '<div class="cards"><div class="card"><div class="label">基线</div>' +
      '<div class="value mono" style="font-size:14px">' + esc(cmp.baseline_run_id) + "</div>" +
      '<div class="foot">' + esc(cmp.baseline_conditions.model_id) + "</div></div>" +
      '<div class="card"><div class="label">候选</div>' +
      '<div class="value mono" style="font-size:14px">' + esc(cmp.candidate_run_id) + "</div>" +
      '<div class="foot">' + esc(cmp.candidate_conditions.model_id) + "</div></div></div>";

    if (skippedEmpty) {
      html += '<div class="notice">默认选择已跳过用例集为空的运行 —— ' +
        "它们几乎不产出指标，作为默认对比对象只会得到一片 N/A。" +
        "这些运行仍可在上方下拉框中手动选择。</div>";
    }

    // 不可比 —— 这是唯一正确的处理：只显示原因，绝不补算 delta
    if (!cmp.comparable) {
      html += '<div class="notice bad"><b>不可比较</b> —— 两次运行的测量条件不一致，' +
        "任何分数变化都没有意义，因此不显示任何变化数字。<ul class=\"cases\">";
      cmp.incomparable_reasons.forEach(function (r) {
        html += "<li>" + esc(r) + "</li>";
      });
      html += "</ul></div>";
      html += conditionsTable(cmp);
      host.innerHTML = html;
      return;
    }

    html += '<div class="notice">✅ 可比较（评估条件一致）。';
    if (cmp.flags.length) {
      html += "软差异标记：" + cmp.flags.map(function (f) {
        return '<span class="badge warn">' + esc(f) + "</span>";
      }).join(" ");
      html += " —— 这些不阻断对比，但跨模型/后端的绝对分数不可横向排名。";
    }
    html += "</div>";

    var t = cmp.case_transitions;
    html += '<div class="transitions">';
    html += tcard("新增失败", t.new_failure.length, "基线通过 → 候选失败", t.new_failure.length ? "bad" : "");
    html += tcard("已修复", t.fixed.length, "基线失败 → 候选通过", "ok");
    html += tcard("持续失败", t.persistent_failure.length, "两侧均失败", "");
    html += tcard("仍然通过", t.still_passing.length, "两侧均通过", "");
    if (t.indeterminate.length) {
      html += tcard("无法判定", t.indeterminate.length, "至少一侧 skipped", "warn");
    }
    html += "</div>";
    var transitionParts = [
      ["新增失败", t.new_failure.length, "var(--bad)"],
      ["已修复", t.fixed.length, "var(--ok)"],
      ["持续失败", t.persistent_failure.length, "var(--warn)"],
      ["仍然通过", t.still_passing.length, "var(--accent)"],
      ["无法判定", t.indeterminate.length, "var(--muted)"]
    ];
    var sharedCount = transitionParts.reduce(function (sum, part) { return sum + part[1]; }, 0);
    if (sharedCount > 0) {
      html += '<div class="signal"><div><h3>共同用例的状态迁移</h3>' +
        '<p>分母 ' + sharedCount + ' 个两次运行均出现的用例；新增/移除用例单独列示</p>' +
        '<div class="stacked" role="img" aria-label="' +
        esc(transitionParts.map(function (part) { return part[0] + ' ' + part[1]; }).join('，')) + '">';
      transitionParts.forEach(function (part) {
        if (part[1] > 0) html += '<span style="width:' +
          (part[1] / sharedCount * 100).toFixed(2) + '%;background:' + part[2] + '"></span>';
      });
      html += '</div><div class="legend">' + transitionParts.map(function (part) {
        return '<span><i class="swatch-square" style="background:' + part[2] +
          '"></i>' + esc(part[0]) + ' <b>' + part[1] + '</b></span>';
      }).join('') + '</div></div></div>';
    }

    if (t.new_failure.length) {
      html += '<div class="notice bad"><b>新增失败用例：</b><ul class="cases">' +
        t.new_failure.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") +
        "</ul></div>";
    }
    if (t.fixed.length) {
      html += '<div class="notice"><b>已修复用例：</b><ul class="cases">' +
        t.fixed.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") +
        "</ul></div>";
    }
    if (t.persistent_failure.length) {
      html += '<div class="notice"><b>持续失败用例：</b><ul class="cases">' +
        t.persistent_failure.map(function (c) { return "<li>" + esc(c) + "</li>"; }).join("") +
        "</ul></div>";
    }
    if (t.added.length || t.removed.length) {
      html += '<div class="notice">用例集发生变化：新增 ' + t.added.length +
        " 个，移除 " + t.removed.length + " 个 —— 比例指标的分母已改变。</div>";
    }

    // 分数维度的回归（与通过/失败迁移是两个独立维度）
    html += "<h2 style=\"margin-top:18px\">分数变化</h2>" +
      '<p class="sub">判定阈值 ' + cmp.degradation_threshold +
      "；分数下降超过阈值记为 regression。</p>";
    html += metricTable(cmp);
    host.innerHTML = html;
  }

  function tcard(label, n, foot, cls) {
    return '<div class="tcard"><div class="l">' + esc(label) + '</div>' +
      '<div class="n ' + (n ? cls : "") + '">' + n + "</div>" +
      '<div class="l">' + esc(foot) + "</div></div>";
  }

  function conditionsTable(cmp) {
    var keys = ["dataset_id", "dataset_version", "judge_id", "judge_version",
                "model_id", "backend_id", "source_type", "data_classification", "created_at"];
    var html = "<h2 style=\"margin-top:16px\">评估条件对照</h2><table><thead><tr><th>条件</th>" +
      "<th>基线</th><th>候选</th><th></th></tr></thead><tbody>";
    keys.forEach(function (k) {
      var a = cmp.baseline_conditions[k], b = cmp.candidate_conditions[k];
      var diff = String(a) !== String(b);
      html += "<tr><td class=\"mono\">" + esc(k) + "</td><td>" + esc(a) + "</td><td>" +
        esc(b) + "</td><td>" + (diff ? '<span class="badge warn">不同</span>' : "") + "</td></tr>";
    });
    return html + "</tbody></table>";
  }

  function metricTable(cmp) {
    var ids = Object.keys(cmp.metric_series).sort();
    var html = '<table><thead><tr><th>指标</th><th class="num">基线</th>' +
      '<th class="num">候选</th><th class="num">变化</th><th>状态</th></tr></thead><tbody>';
    var any = false;
    ids.forEach(function (id) {
      var m = cmp.metric_series[id];
      var b = m.baseline, c = m.candidate;
      var bv = b && (b.status === "ok" || b.status === "partial") ? b.value : null;
      var cv = c && (c.status === "ok" || c.status === "partial") ? c.value : null;
      var d = m.display_delta;
      var rowCls = (d !== null && d < 0) ? ' style="background:#fdf4f3"' : "";
      html += "<tr" + rowCls + '><td class="mono">' + esc(id) + "</td>" +
        '<td class="num">' + (bv === null ? '<span class="na">N/A</span>' : esc(fmt(bv, b.metric_unit))) + "</td>" +
        '<td class="num">' + (cv === null ? '<span class="na">N/A</span>' : esc(fmt(cv, c.metric_unit))) + "</td>" +
        '<td class="num">' + (d === null ? '<span class="na" title="缺失、部分数据、版本、单位或精度不一致时不计算差值">N/A</span>'
                                          : esc(fmtDelta(d, m.metric_unit))) + "</td>" +
        "<td>" + statusBadge(c) + "</td></tr>";
      if (bv !== null || cv !== null) any = true;
    });
    html += "</tbody></table>";
    if (!any) html += '<div class="empty">两侧均无可用数值。</div>';
    return html;
  }

  // ── 无法读取的文件 ───────────────────────────────────────
  function renderUnreadable() {
    var host = document.getElementById("unreadable-body");
    var section = document.getElementById("unreadable");
    if (!DATA.unreadable.length) {
      host.innerHTML = '<div class="empty">全部文件均通过契约校验。</div>';
      return;
    }
    section.className = "alert";
    var html = '<div class="notice bad"><b>' + DATA.unreadable.length +
      "</b> 个文件未通过校验，已排除在统计之外（不会静默跳过）。</div>" +
      "<table><thead><tr><th>文件</th><th>原因码</th><th>说明</th></tr></thead><tbody>";
    DATA.unreadable.forEach(function (u) {
      html += '<tr><td class="mono">' + esc(u.source_path) + "</td><td>" +
        '<span class="badge bad">' + esc(u.reason_code) + "</span></td><td>" +
        esc(u.message) + "</td></tr>";
    });
    host.innerHTML = html + "</tbody></table>";
  }

  // ── 装配 ─────────────────────────────────────────────────
  renderBanner();
  renderOverview();
  renderUnreadable();

  var tg = document.getElementById("trend-group");
  var cg = document.getElementById("cmp-group");
  groupOptions(tg, function () { trendGroup = +tg.value; trendMetric = null; renderTrend(); });
  groupOptions(cg, function () { cmpGroup = +cg.value; cmpBase = null; cmpCand = null; renderComparison(); });

  var tm = document.getElementById("trend-metric");
  tm.onchange = function () { trendMetric = tm.value; renderTrend(); };
  document.getElementById("cmp-base").onchange = function () {
    cmpBase = this.value; renderComparison();
  };
  document.getElementById("cmp-cand").onchange = function () {
    cmpCand = this.value; renderComparison();
  };

  renderTrend();
  renderComparison();
  window.addEventListener("resize", function () {
    if (DATA.groups.length) {
      var g = DATA.groups[trendGroup];
      if (trendMetric && g.trends[trendMetric]) {
        drawChart(g.trends[trendMetric], g.run_ids, ["#2c5fb3", "#a86400", "#1a7f4b", "#8a3fb3"]);
      }
    }
  });
})();
</script>
</body>
</html>
